[project]
name = "xcut"
version = "0.1.0"
description = "Hi-C contact matrix enhancement toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.10.1",
    "click>=8.3.1",
    "cooler>=0.10.4",
    "cooltools>=0.7.1",
    "einops>=0.8.1",
    "hicrep>=0.2.6",
    "matplotlib>=3.10.0",
    "nbformat>=5.10.4",
    "plotly>=6.5.2",
    "polars[numpy,pandas,pyarrow]>=1.34.0",
    "pyarrow>=21.0.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0",
    "rich>=14.1.0",
    "scikit-image>=0.22.0",
    "scipy>=1.11.0",
    "seaborn>=0.13.2",
    "timm>=1.0.20",
    "torch>=2.1.0",
    "torch-geometric>=2.7.0",
    "torchvision>=0.16.0",
    "tqdm>=4.66.0",
    "optuna>=4.7.0",
    "pybigwig>=0.3.25",
    "typer>=0.19.2",
    "vector-quantize-pytorch>=1.27.19",
]
authors = [
    { name = "stasys-hub", email = "github@stasys.org" }
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
xcut = "xcut.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xcut"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.0",
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["xcut"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
